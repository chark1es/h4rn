[workspace]
members = ["crates/*"]
exclude = ["apps/desktop/src-tauri", "apps/mobile/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/chark1es/h4rn"
authors = ["h4rn contributors"]

[workspace.dependencies]
# Internal crates
h4rn-connect = { path = "crates/h4rn-connect" }
h4rn-core = { path = "crates/h4rn-core" }
h4rn-daemon = { path = "crates/h4rn-daemon" }
h4rn-forge = { path = "crates/h4rn-forge" }
h4rn-harness = { path = "crates/h4rn-harness" }
h4rn-mcp = { path = "crates/h4rn-mcp" }
h4rn-meter = { path = "crates/h4rn-meter" }
h4rn-protocol = { path = "crates/h4rn-protocol" }
h4rn-proxy = { path = "crates/h4rn-proxy" }
h4rn-skills = { path = "crates/h4rn-skills" }
h4rn-transport = { path = "crates/h4rn-transport" }
h4rn-vt = { path = "crates/h4rn-vt" }

# Shared third-party dependencies. Versions are pinned so every crate in the
# workspace resolves the same implementation (ADR-017).
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
ed25519-dalek = { version = "2.2.0", default-features = false, features = [
    "alloc",
    "zeroize",
] }
futures = "0.3.34"
getrandom = "0.3.4"
hex = "0.4.3"
js-sys = "0.3.81"
keyring = "4.2.0"
portable-pty = "0.9.0"
rand = "0.9.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snow = { version = "0.10.0", default-features = false, features = [
    "use-blake2",
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "chrono",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
    "sqlite",
    "tls-rustls",
] }
subtle = "2.6.1"
url = "2.5.8"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
tracing = "0.1.44"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "fs", "trace", "limit"] }
toml = "0.8.23"
openidconnect = { version = "3.5.0", default-features = false, features = ["reqwest", "rustls-tls"] }
chacha20poly1305 = "0.10.1"

tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ts-rs = { version = "11.1.0", features = ["chrono-impl", "serde-json-impl"] }
uuid = { version = "1.29.2", features = ["serde", "v7", "js"] }
wasm-bindgen = "0.2.104"
wasm-bindgen-test = "0.3.54"
x25519-dalek = { version = "2.0.1", default-features = false, features = [
    "static_secrets",
] }

# Added by the Claude Code adapter (Phase 1b).
base64 = "0.22.1"
libc = "0.2.191"

# Added by IDE mode (Phase 2): filesystem walk, search and watching.
grep-regex = "0.1.13"
grep-searcher = "0.1.15"
ignore = "0.4.23"
notify = "8.2.0"
# Added by the content-addressed attachment store (Phase 2, ADR-008).
image = { version = "0.25.10", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
infer = "0.22.0"
# Added by Phase 3 remote access: terminal pairing QR rendering.
qrcode = { version = "0.14.1", default-features = false }
