<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h4rn · Quiet native</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────────── Tokens ───────────── */
:root{
  color-scheme: light;
  --bg:        oklch(0.995 0.0015 260);
  --bg-side:   oklch(0.970 0.0025 260);
  --bg-raised: oklch(1 0 0);
  --bg-sunk:   oklch(0.978 0.002 260);
  --fill:      oklch(0.955 0.003 260);
  --fill-2:    oklch(0.925 0.004 260);
  --hover:     oklch(0.962 0.003 260);
  --sel:       oklch(0.940 0.004 260);
  --line:      oklch(0.915 0.003 260);
  --line-2:    oklch(0.860 0.004 260);
  --fg:        oklch(0.210 0.006 260);
  --fg-2:      oklch(0.440 0.007 260);
  --fg-3:      oklch(0.510 0.007 260);
  --accent:    oklch(0.540 0.180 258);
  --accent-hi: oklch(0.490 0.180 258);
  --accent-fg: oklch(0.995 0 0);
  --accent-tx: oklch(0.500 0.170 258);
  --accent-soft: oklch(0.955 0.024 258);
  --focus:     oklch(0.600 0.170 258);
  --warn:      oklch(0.500 0.110 62);
  --warn-dot:  oklch(0.760 0.150 72);
  --warn-soft: oklch(0.968 0.030 80);
  --ok:        oklch(0.490 0.120 150);
  --ok-dot:    oklch(0.640 0.150 150);
  --danger:    oklch(0.520 0.190 27);
  --danger-soft: oklch(0.966 0.020 25);
  --add-bg:    oklch(0.966 0.028 150);
  --del-bg:    oklch(0.966 0.020 25);
  --add-tx:    oklch(0.450 0.120 150);
  --del-tx:    oklch(0.500 0.180 27);
  --syn-kw:    oklch(0.470 0.150 300);
  --syn-str:   oklch(0.480 0.110 150);
  --syn-fn:    oklch(0.470 0.130 250);
  --syn-cm:    oklch(0.520 0.010 260);
  --scrim:     oklch(0.20 0.01 260 / 0.28);
  --sh-pop:    0 1px 2px oklch(0.2 0.01 260 / .06), 0 10px 28px -10px oklch(0.2 0.01 260 / .22);
  --sh-dlg:    0 2px 8px oklch(0.2 0.01 260 / .08), 0 28px 64px -16px oklch(0.2 0.01 260 / .32);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#6250d6;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --dur-1: 120ms; --dur-2: 180ms; --dur-3: 240ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: dark; } }
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        oklch(0.190 0.004 260);
  --bg-side:   oklch(0.163 0.004 260);
  --bg-raised: oklch(0.232 0.005 260);
  --bg-sunk:   oklch(0.172 0.004 260);
  --fill:      oklch(0.240 0.005 260);
  --fill-2:    oklch(0.285 0.006 260);
  --hover:     oklch(0.222 0.005 260);
  --sel:       oklch(0.252 0.006 260);
  --line:      oklch(0.268 0.005 260);
  --line-2:    oklch(0.345 0.006 260);
  --fg:        oklch(0.945 0.003 260);
  --fg-2:      oklch(0.760 0.005 260);
  --fg-3:      oklch(0.640 0.006 260);
  --accent:    oklch(0.560 0.170 258);
  --accent-hi: oklch(0.610 0.170 258);
  --accent-tx: oklch(0.760 0.120 258);
  --accent-soft: oklch(0.275 0.050 258);
  --focus:     oklch(0.700 0.140 258);
  --warn:      oklch(0.830 0.120 80);
  --warn-dot:  oklch(0.790 0.140 76);
  --warn-soft: oklch(0.265 0.035 75);
  --ok:        oklch(0.780 0.130 150);
  --ok-dot:    oklch(0.700 0.140 150);
  --danger:    oklch(0.730 0.150 25);
  --danger-soft: oklch(0.262 0.040 25);
  --add-bg:    oklch(0.245 0.032 150);
  --del-bg:    oklch(0.245 0.032 25);
  --add-tx:    oklch(0.790 0.130 150);
  --del-tx:    oklch(0.750 0.140 25);
  --syn-kw:    oklch(0.780 0.110 300);
  --syn-str:   oklch(0.790 0.110 150);
  --syn-fn:    oklch(0.790 0.100 250);
  --syn-cm:    oklch(0.620 0.010 260);
  --scrim:     oklch(0.05 0.01 260 / 0.5);
  --sh-pop:    0 1px 2px oklch(0 0 0 / .3), 0 12px 32px -10px oklch(0 0 0 / .6);
  --sh-dlg:    0 2px 8px oklch(0 0 0 / .35), 0 28px 64px -16px oklch(0 0 0 / .7);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
}

/* ───────────── Base ───────────── */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  background:var(--bg); color:var(--fg);
  font: 400 13px/18px var(--font);
  font-feature-settings: "tnum" 1, "cv11" 1;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow:hidden;
}
::selection{ background: var(--accent-soft); color: var(--fg); }
button,input,textarea,select{ font:inherit; color:inherit; }
a{ color:inherit; text-decoration:none; }
a.t-accent:hover{ text-decoration:underline; text-underline-offset:2px; }
.kbd svg{ width:11px; height:11px; vertical-align:-1.5px; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
button{ background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
:focus{ outline:none; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }
code,.mono{ font-family:var(--mono); font-size:12px; font-feature-settings:"tnum" 1, "zero" 0; }
.num{ font-variant-numeric: tabular-nums; }
svg.i{ width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
svg.i.s14{ width:14px; height:14px; } svg.i.s12{ width:12px; height:12px; } svg.i.s18{ width:18px; height:18px; } svg.i.s20{ width:20px; height:20px; } svg.i.s22{ width:22px; height:22px; } svg.i.s24{width:24px;height:24px;}
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:12px; border:3px solid transparent; background-clip:content-box; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.muted{ color:var(--fg-2); } .faint{ color:var(--fg-3); }
.t-warn{ color:var(--warn); } .t-ok{ color:var(--ok); } .t-danger{ color:var(--danger); } .t-accent{ color:var(--accent-tx); }
.sep{ color:var(--line-2); margin:0 6px; }
.dot{ width:6px; height:6px; border-radius:50%; display:inline-block; flex:none; background:var(--fg-3); }
.dot.on{ background:var(--ok-dot); } .dot.off{ background:transparent; box-shadow: inset 0 0 0 1.5px var(--fg-3); } .dot.warn{ background:var(--warn-dot); } .dot.you{ background:var(--accent); width:8px; height:8px; }

/* ───────────── Controls ───────────── */
.btn{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:6px; font-weight:500; white-space:nowrap;
  transition: background var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out), color var(--dur-1); }
.btn.primary{ background:var(--accent); color:var(--accent-fg); }
.btn.primary:hover{ background:var(--accent-hi); }
.btn.secondary{ background:var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 0 oklch(0.2 0.01 260 / .04); }
.btn.secondary:hover{ background:var(--hover); }
.btn.ghost{ color:var(--fg-2); }
.btn.ghost:hover{ background:var(--hover); color:var(--fg); }
.btn.danger{ color:var(--danger); box-shadow: inset 0 0 0 1px var(--line-2); background:var(--bg-raised); }
.btn.danger:hover{ background:var(--danger-soft); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn .kbd{ margin-left:2px; }
.btn.primary .kbd{ color: oklch(1 0 0 / .78); border-color: oklch(1 0 0 / .3); }
.ibtn{ width:28px; height:28px; display:inline-grid; place-items:center; border-radius:6px; color:var(--fg-2); transition: background var(--dur-1), color var(--dur-1); }
.ibtn:hover{ background:var(--hover); color:var(--fg); }
.ibtn.on{ background:var(--fill); color:var(--fg); }
.kbd{ font: 500 11px/16px var(--font); color:var(--fg-3); padding:0 4px; border-radius:4px; box-shadow: inset 0 0 0 1px var(--line); min-width:18px; text-align:center; display:inline-block; letter-spacing:.02em; }
.seg{ display:flex; padding:2px; gap:2px; background:var(--fill); border-radius:8px; }
.seg button{ flex:1; height:24px; border-radius:6px; color:var(--fg-2); font-weight:500; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 10px; transition: background var(--dur-1), color var(--dur-1); white-space:nowrap; }
.seg button:hover{ color:var(--fg); }
.seg button[aria-selected="true"]{ background:var(--bg-raised); color:var(--fg); box-shadow: 0 1px 2px oklch(0.2 0.01 260 / .12), 0 0 0 .5px oklch(0.2 0.01 260 / .08); }
:root[data-theme="dark"] .seg button[aria-selected="true"]{ background: var(--fill-2); box-shadow:none; }
.seg .c{ color:var(--fg-3); font-weight:400; }
.seg.inline{ display:inline-flex; } .seg.inline button{ flex:none; }
.input{ height:28px; border-radius:6px; padding:0 10px; background:var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line-2); border:0; width:100%; }
.input:focus-visible{ outline:none; box-shadow: inset 0 0 0 1px var(--focus), 0 0 0 3px color-mix(in oklch, var(--focus) 25%, transparent); }
.switch{ display:inline-block; vertical-align:middle; width:30px; height:18px; border-radius:8px; background:var(--fill-2); position:relative; flex:none; box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--fg) 12%, transparent); transition: background var(--dur-2) var(--ease-out); }
.switch::after{ content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 2px oklch(0 0 0 / .25); transition: transform var(--dur-2) var(--ease-out); }
.switch[aria-checked="true"]{ background:var(--accent); box-shadow:none; }
.switch[aria-checked="true"]::after{ transform: translateX(12px); }
.switch[aria-disabled="true"]{ opacity:.4; cursor:not-allowed; }
.check{ width:16px; height:16px; border-radius:4px; box-shadow: inset 0 0 0 1px var(--line-2); display:inline-grid; place-items:center; flex:none; background:var(--bg-raised); color:var(--accent-fg); }
.check.on{ background:var(--accent); box-shadow:none; }
.badge{ display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 6px; border-radius:4px; font-size:12px; font-weight:500; color:var(--fg-2); background:var(--fill); white-space:nowrap; }
.badge.warn{ color:var(--warn); background:var(--warn-soft); }
.badge.danger{ color:var(--danger); background:var(--danger-soft); }
.badge.ok{ color:var(--ok); background: color-mix(in oklch, var(--ok-dot) 14%, var(--bg)); }
.badge.you{ color:var(--accent-tx); background:var(--accent-soft); }

/* ───────────── Identity + state placeholders ───────────── */
.blob{ display:inline-block; flex:none; vertical-align:-3px; }
.blob .b{ fill: oklch(0.80 0.085 var(--h)); }
.blob .e{ fill: oklch(0.26 0.03 var(--h)); }
:root[data-theme="dark"] .blob .b{ fill: oklch(0.70 0.090 var(--h)); }
:root[data-theme="dark"] .blob .e{ fill: oklch(0.18 0.02 var(--h)); }
.orb{ position:relative; display:inline-block; width:14px; height:14px; flex:none; color:var(--fg-2); }
.orb::before{ content:""; position:absolute; inset:4px; border-radius:50%; background:currentColor; opacity:.9; }
.orb i{ position:absolute; inset:0; border-radius:50%; transform: rotate(50deg); animation: orbit 1.4s linear infinite; }
.orb i::after{ content:""; position:absolute; top:0; left:50%; width:3px; height:3px; margin-left:-1.5px; border-radius:50%; background:currentColor; }
.orb i:nth-child(2){ animation-duration:2.1s; animation-direction:reverse; inset:1px; transform: rotate(230deg); }
.orb i:nth-child(2)::after{ opacity:.55; }
.orb.queued::before{ animation: breathe 2.4s ease-in-out infinite; } .orb.queued i{ display:none; }
.orb.held::before{ inset:3px; background:transparent; box-shadow: inset 0 0 0 1.5px currentColor; } .orb.held i{ display:none; }
.orb.lg{ width:20px; height:20px; } .orb.lg::before{ inset:6px; } .orb.lg i::after{ width:4px; height:4px; margin-left:-2px; }
@keyframes orbit{ from{ transform: rotate(50deg); } to{ transform: rotate(410deg); } }
@keyframes breathe{ 50%{ transform: scale(.6); opacity:.5; } }
.caret{ display:inline-block; width:2px; height:1.05em; background:var(--fg); vertical-align:-2px; margin-left:1px; animation: blink 1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.skel{ background:var(--fill); border-radius:4px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse{ 50%{ opacity:.55; } }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition-duration:1ms !important; }
  .skel{ opacity:.7; }
}
body.still *, body.still *::before, body.still *::after{ animation-play-state: paused !important; }

/* ───────────── Desktop shell ───────────── */
#stage{ position:fixed; inset:0; }
.app{ display:flex; height:100%; width:100%; background:var(--bg); }
.side{ width:var(--side-w,288px); flex:none; background:var(--bg-side); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; position:relative; }
.side-hd{ display:flex; flex-direction:column; gap:8px; padding:10px 8px 10px; flex:none; }
.side-top{ display:flex; align-items:center; gap:2px; height:32px; padding:0 0 0 8px; }
.side-top .grow{ flex:1; }
.word{ font-weight:600; font-size:14px; letter-spacing:-0.01em; }
.side-search{ display:flex; align-items:center; gap:8px; height:28px; padding:0 8px; border-radius:6px; color:var(--fg-3); background:var(--bg); box-shadow: inset 0 0 0 1px var(--line); width:100%; }
.side-search span:first-of-type{ flex:1; }
.side-search input{ flex:1; min-width:0; border:0; background:transparent; height:100%; }
.side-search input::placeholder{ color:var(--fg-3); }
.side-search input:focus-visible{ outline:none; }
.side-search:focus-within{ box-shadow: inset 0 0 0 1px var(--focus), 0 0 0 3px color-mix(in oklch, var(--focus) 25%, transparent); }
.side .seg button{ padding:0 6px; }
.nav{ display:flex; align-items:center; gap:9px; height:28px; padding:0 8px; border-radius:6px; color:var(--fg-2); font-weight:500; transition: background var(--dur-1); }
.nav:hover{ background:var(--hover); color:var(--fg); }
.nav[aria-current="page"]{ background:var(--fill-2); color:var(--fg); }
:root[data-theme="dark"] .nav[aria-current="page"]{ background:var(--sel); }
.nav .lbl{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav .ct{ color:var(--fg-3); font-weight:400; font-size:12px; }
.nav.sub{ padding-left:33px; font-weight:400; height:26px; }
.side-h{ font-size:12px; color:var(--fg-3); font-weight:500; padding:16px 8px 4px; display:flex; justify-content:space-between; align-items:center; height:auto; }
.side-h .ibtn.sm{ width:22px; height:22px; margin:-4px -4px -4px 0; }
.setnav{ display:flex; flex-direction:column; gap:2px; }
.host{ display:flex; align-items:center; gap:8px; height:28px; padding:0 8px; border-radius:6px; color:var(--fg-2); }
.host:hover{ background:var(--hover); color:var(--fg); }
.host .lbl{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.host.sub{ padding-left:22px; }
.host .meta{ font-size:12px; color:var(--fg-3); }

/* project groups: the thread list, one level deep */
.side-list{ flex:1; overflow:auto; min-height:0; padding:2px 8px 12px; }
.pg + .pg{ margin-top:12px; }
.pg-h{ display:flex; align-items:center; gap:2px; position:relative; }
.pg-tog{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; height:28px; padding:0 8px 0 10px; border-radius:6px; color:var(--fg-2); transition: background var(--dur-1); }
.pg-tog:hover{ background:var(--hover); }
.pg-tog .nm{ font-weight:600; white-space:nowrap; }
.pg-h.act .nm{ color:var(--fg); }
.pg-tog .hn{ font-size:12px; color:var(--fg-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.pg-tog .grow{ flex:1; }
.pg-tog .ct{ font-size:12px; color:var(--fg-3); }
.pg-tog .chev{ color:var(--fg-3); flex:none; transition: transform var(--dur-2) var(--ease-out); }
.pg-tog[aria-expanded="false"] .chev{ transform: rotate(-90deg); }
.pg-h .add{ width:24px; height:24px; position:absolute; right:26px; opacity:0; background:var(--bg-side); transition: opacity var(--dur-1); }
.pg-h:hover .add, .pg-h:focus-within .add{ opacity:1; }
.pg-h .add:hover{ background:var(--hover); }
.pmono{ width:16px; height:16px; border-radius:4px; display:inline-grid; place-items:center; flex:none; background:var(--fill-2); color:var(--fg-2); font:600 10px/1 var(--font); }
:root[data-theme="dark"] .pmono{ background:var(--line-2); color:var(--fg); }
.side .rows{ padding:2px 0 0; display:flex; flex-direction:column; gap:1px; }
.side .row{ padding:7px 10px 8px; }
.side .row-st{ width:16px; }
.side .row + .row::before{ display:none; }
.side .row:hover{ background:var(--hover); }
.side .row.sel{ background:var(--fill-2); }
:root[data-theme="dark"] .side .row.sel{ background:var(--fill-2); }
.side .snoozed{ display:flex; align-items:center; gap:8px; width:100%; height:32px; padding:0 10px; margin-top:12px; border-radius:6px; border:0; color:var(--fg-2); font-size:13px; }
.side .snoozed:hover{ background:var(--hover); }
.side .banner{ margin:0 8px 8px; }
.side-list .side-empty{ padding:14px 10px; }

/* footer: secondary destinations live here, not in a second column */
.side-ft{ flex:none; display:flex; align-items:center; gap:2px; height:44px; padding:0 8px; border-top:1px solid var(--line); }
.hostbtn{ flex:1; min-width:0; display:inline-flex; align-items:center; gap:8px; height:28px; padding:0 8px; border-radius:6px; color:var(--fg-2); font-size:12px; white-space:nowrap; }
.hostbtn:hover, .hostbtn.on{ background:var(--hover); color:var(--fg); }
.ibtn.wide{ width:auto; padding:0 7px 0 6px; gap:4px; display:inline-flex; }
.ibtn .n{ font-size:12px; color:var(--fg-3); }
.hostpop{ left:8px; right:8px; bottom:50px; padding:6px; z-index:15; }
.hp-h{ display:flex; justify-content:space-between; align-items:baseline; padding:6px 8px 6px; font-weight:600; }
.hp-h .faint{ font-size:12px; font-weight:400; }
.hp-conn{ font-size:12px; color:var(--fg-3); padding:6px 8px 4px; }
.hp-sep{ height:1px; background:var(--line); margin:6px 2px; }

/* resize handles */
.rz{ position:absolute; top:0; bottom:0; width:8px; z-index:6; cursor:col-resize; touch-action:none; }
.side > .rz{ right:-4px; } .rp > .rz{ left:-4px; }
.rz::after{ content:""; position:absolute; top:0; bottom:0; left:3.5px; width:1px; background:transparent; transition: background var(--dur-1) var(--ease-out); }
.rz:hover::after, .rz.drag::after, .rz:focus-visible::after{ background:var(--focus); left:3px; width:2px; }
.rz:focus-visible{ outline:none; }

.pane{ width:328px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--bg); }
.pane-head{ display:flex; align-items:center; gap:4px; height:52px; padding:0 10px 0 16px; flex:none; }
.pane-head h2{ margin:0; font-size:15px; font-weight:600; letter-spacing:-0.01em; flex:1; }
.pane-sub{ padding:0 12px 10px; flex:none; }
.scroll{ overflow:auto; min-height:0; flex:1; }
.main{ flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; position:relative; }

/* thread rows */
.rows{ padding:2px 6px 8px; }
.row{ display:flex; gap:10px; width:100%; padding:9px 10px 10px; border-radius:8px; position:relative; transition: background var(--dur-1); }
.row:hover{ background:var(--hover); }
.row.sel{ background:var(--sel); }
.row + .row::before{ content:""; position:absolute; top:0; left:34px; right:10px; height:1px; background:var(--line); }
.row.sel::before, .row.sel + .row::before, .row:hover::before, .row:hover + .row::before{ opacity:0; }

/* thread detail */

.prov{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--fg-2); margin-top:3px; white-space:nowrap; overflow:hidden; }

.ag-head b{ color:var(--fg-2); font-weight:500; }
.prose{ font-size:14px; line-height:22px; margin:0 0 12px; text-wrap:pretty; }
.prose code{ font-size:12.5px; background:var(--fill); padding:1px 5px; border-radius:4px; }
.tools{ margin:4px 0 14px; }
.tool{ display:flex; align-items:center; gap:10px; height:28px; padding:0 8px; margin:0 -8px; border-radius:6px; font-size:13px; color:var(--fg-2); width:calc(100% + 16px); }
.tool:hover{ background:var(--hover); }
.tool .verb{ width:44px; flex:none; color:var(--fg-2); }
.tool .tgt{ font-family:var(--mono); font-size:12px; color:var(--fg); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.tool .chev{ color:var(--fg-3); opacity:0; transition: opacity var(--dur-1), transform var(--dur-2) var(--ease-out); flex:none; }

.tool-out{ display:none; margin:2px 0 8px 26px; padding:10px 12px; border-radius:8px; background:var(--bg-sunk); box-shadow: inset 0 0 0 1px var(--line); font: 12px/18px var(--mono); color:var(--fg-2); white-space:pre; overflow:auto; }

.tool .add{ color:var(--add-tx); } .tool .del{ color:var(--del-tx); }
.changes{ border-radius:12px; box-shadow: inset 0 0 0 1px var(--line); margin:4px 0 16px; overflow:hidden; background:var(--bg); }
.ch-head{ display:flex; align-items:center; gap:10px; height:40px; padding:0 8px 0 14px; }

.add{ color:var(--add-tx); } .del{ color:var(--del-tx); }

.ln.a{ background:var(--add-bg); } .ln.a .sg{ color:var(--add-tx); }
.ln.d{ background:var(--del-bg); } .ln.d .sg{ color:var(--del-tx); }
.live-line{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--fg-3); margin-top:-2px; }
.sub-row{ display:flex; align-items:center; gap:10px; height:32px; padding:0 10px; border-radius:8px; box-shadow: inset 0 0 0 1px var(--line); margin: 6px 0 14px; font-size:13px; }

.dock{ flex:none; padding:0 0 14px; }

.ask{ border-radius:12px; background:var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line-2), var(--sh-pop); padding:14px 14px 12px 16px; transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out); }

/* inspector */

.kids{ padding-left:30px; position:relative; }

.node:hover{ background:var(--hover); }

.insp-sec{ border-top:1px solid var(--line); padding:14px 16px; }
.insp-sec h3{ margin:0 0 8px; font-size:13px; font-weight:600; }
.kv{ display:grid; grid-template-columns: 96px 1fr; gap:6px 12px; font-size:12px; }
.kv dt{ color:var(--fg-3); } .kv dd{ margin:0; color:var(--fg); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* terminal */
.term{ flex:none; height:340px; border-top:1px solid var(--line); display:flex; flex-direction:column; background:var(--bg-sunk); }
.term-head{ display:flex; align-items:center; gap:4px; height:36px; padding:0 8px 0 12px; border-bottom:1px solid var(--line); flex:none; }
.ttab{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:6px; color:var(--fg-2); font-size:12px; font-weight:500; }
.ttab[aria-selected="true"]{ background:var(--fill); color:var(--fg); }

.term-body .p{ color:var(--accent-tx); } .term-body .d{ color:var(--fg-3); } .term-body .g{ color:var(--ok); } .term-body .r{ color:var(--danger); } .term-body .y{ color:var(--warn); }
.term-cur{ display:inline-block; width:7.5px; height:15px; background:var(--fg); vertical-align:-3px; animation: blink 1s steps(1) infinite; }

/* generic page */
.page{ flex:1; overflow:auto; min-height:0; }
.page-head{ display:flex; align-items:center; gap:10px; height:52px; padding:0 16px 0 24px; border-bottom:1px solid var(--line); flex:none; }

.wrap{ max-width:1080px; margin:0 auto; padding:24px 32px 48px; }
.sec{ margin-bottom:36px; }

.list{ border-top:1px solid var(--line); }

.tbl th{ text-align:left; font-weight:500; font-size:12px; color:var(--fg-3); height:32px; border-bottom:1px solid var(--line); padding:0 12px 0 0; white-space:nowrap; }

/* states */
.banner{ display:flex; align-items:center; gap:10px; padding:10px 12px; margin:0 12px 8px; border-radius:8px; background:var(--fill); font-size:12px; color:var(--fg-2); }

/* overlay */

.pop{ position:absolute; z-index:15; background:var(--bg-raised); border-radius:12px; box-shadow: var(--sh-pop), inset 0 0 0 1px var(--line); padding:14px; }

/* IDE */
.ftree{ width:244px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--bg); }
.fnode{ display:flex; align-items:center; gap:6px; height:26px; padding:0 10px 0 calc(10px + var(--d,0) * 14px); border-radius:6px; margin:0 6px; color:var(--fg-2); font-size:13px; }
.fnode:hover{ background:var(--hover); }

.fnode .grow{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.etabs{ display:flex; align-items:flex-end; height:38px; border-bottom:1px solid var(--line); padding:0 8px; gap:2px; flex:none; }
.etab{ display:inline-flex; align-items:center; gap:8px; height:30px; padding:0 10px 0 12px; border-radius:6px 6px 0 0; color:var(--fg-2); font-size:12.5px; position:relative; }
.etab[aria-selected="true"]{ background:var(--bg-sunk); color:var(--fg); box-shadow: inset 0 0 0 1px var(--line); clip-path: inset(-1px -1px 1px -1px); }
.etab .dirty{ width:6px; height:6px; border-radius:50%; background:var(--fg-2); }
.ebar{ display:flex; align-items:center; gap:10px; height:40px; padding:0 12px 0 16px; border-bottom:1px solid var(--line); background:var(--bg-sunk); flex:none; font-size:12px; color:var(--fg-2); }
.ebar .grow{ flex:1; }
.code{ flex:1; overflow:auto; background:var(--bg-sunk); font: 12.5px/20px var(--mono); padding:8px 0; }
.code .ln{ padding-right:16px; }
.code .ln .n{ width:52px; }
.sk{ color:var(--syn-kw); } .ss{ color:var(--syn-str); } .sf{ color:var(--syn-fn); } .sc{ color:var(--syn-cm); }
.ln .cx{ white-space:pre; }
.statusbar{ height:26px; display:flex; align-items:center; gap:16px; padding:0 16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--fg-3); background:var(--bg); flex:none; }

/* usage */
.stats{ display:grid; grid-template-columns: repeat(6, 1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.stat{ padding:14px 16px 14px 0; }

.stat .l{ font-size:12px; color:var(--fg-2); display:flex; justify-content:space-between; }

.stat .d{ font-size:12px; color:var(--fg-3); margin-top:2px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.spark{ width:56px; height:18px; color:var(--fg-3); }
.chart-wrap{ position:relative; }

.legend b{ font-weight:500; color:var(--fg); }
.tip{ position:absolute; pointer-events:none; z-index:5; background:var(--bg-raised); border-radius:8px; box-shadow: var(--sh-pop), inset 0 0 0 1px var(--line); padding:8px 10px; font-size:12px; min-width:168px; display:none; }
.tip .r{ display:flex; gap:8px; align-items:center; justify-content:space-between; }
.tip .r i{ width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:6px; }
.meter{ height:6px; border-radius:3px; background:var(--fill-2); overflow:hidden; }
.meter i{ display:block; height:100%; background:var(--fg-2); border-radius:3px; }
.meter.warn i{ background:var(--warn-dot); } .meter.full i{ background:var(--danger); }
.split{ display:flex; height:8px; border-radius:4px; overflow:hidden; gap:2px; }
.resume{ border-radius:12px; box-shadow: inset 0 0 0 1px var(--line-2); padding:16px 18px; display:flex; gap:20px; align-items:center; background:var(--bg-raised); }

/* library */

.conflict .t{ font-weight:500; }

/* PR */
.pr-cols{ display:flex; gap:40px; max-width:1040px; margin:0 auto; padding:24px 32px 48px; }
.pr-main{ flex:1; min-width:0; }
.pr-side{ width:264px; flex:none; }
.tabs{ display:flex; gap:20px; border-bottom:1px solid var(--line); margin-bottom:20px; }

.cmt{ padding:16px 0; border-bottom:1px solid var(--line); }
.cmt-h{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--fg-3); margin-bottom:8px; }

.cmt p{ margin:0 0 10px; font-size:14px; line-height:21px; }
.ctx-code{ border-radius:8px; box-shadow: inset 0 0 0 1px var(--line); overflow:hidden; margin-bottom:10px; font: 12px/20px var(--mono); background:var(--bg-sunk); }
.ctx-code .fh{ font-family:var(--font); font-size:12px; color:var(--fg-2); padding:6px 12px; border-bottom:1px solid var(--line); background:var(--bg); }

.chk{ display:flex; align-items:center; gap:10px; height:34px; font-size:13px; }

.side-sec h3{ margin:0 0 8px; font-size:12px; color:var(--fg-3); font-weight:500; display:flex; justify-content:space-between; }

/* settings */

.form h1{ font-size:20px; line-height:26px; margin:4px 0 4px; font-weight:600; letter-spacing:-0.015em; }

.field .lab{ width:200px; flex:none; }
.field .lab .t{ font-weight:500; } .field .lab .s{ font-size:12px; color:var(--fg-2); margin-top:2px; }
.field .ctl{ flex:1; display:flex; align-items:center; gap:10px; min-width:0; }

.secret svg{ color:var(--fg-2); }
.probe{ display:grid; grid-template-columns: 18px 150px 1fr; gap:8px 8px; font-size:12px; align-items:center; padding:10px 0 4px; }
.probe .k{ color:var(--fg-2); } .probe .v{ color:var(--fg); }

.code-big{ font: 500 22px/28px var(--mono); letter-spacing:.06em; }

/* ───────────── Main header: view cluster ───────────── */
.th-head.bare{ padding-left:12px; }
.hd-l{ display:flex; align-items:center; gap:2px; flex:none; }

.ibtn{ position:relative; }
.pip{ width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; flex:none; }
.ibtn > .pip{ position:absolute; top:4px; right:4px; width:7px; height:7px; box-shadow: 0 0 0 2px var(--bg); }
.viewseg button{ height:24px; padding:0 10px; }
.ws-title{ display:flex; align-items:center; gap:8px; }
.tchip{ display:inline-flex; align-items:center; gap:8px; height:28px; padding:0 10px 0 9px; border-radius:6px; background:var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line-2); font-weight:500; max-width:340px; min-width:0; flex:0 1 auto; transition: background var(--dur-1); }

.tchip .t{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.tchip .s{ color:var(--accent-tx); white-space:nowrap; font-size:12px; }
.crumb{ display:flex; align-items:center; gap:2px; font-size:12px; color:var(--fg-3); margin-bottom:4px; }
.crumb a:hover{ color:var(--fg); }
.crumb .sep{ margin:0 4px; }
.scope{ display:flex; align-items:center; gap:10px; padding:8px 16px; border-bottom:1px solid var(--line); font-size:12px; color:var(--fg-2); background:var(--bg-sunk); flex:none; white-space:nowrap; }

.scope .grow{ flex:1; }
.etabs-note{ font-size:12px; align-self:center; padding-right:8px; }
.term{ height:300px; }

/* ───────────── Right panel ───────────── */
.rp{ width:var(--rp-w,400px); flex:none; border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--bg); position:relative; }

.rp-head > .ibtn{ align-self:center; }
.rp-tab{ position:relative; display:flex; align-items:center; gap:6px; color:var(--fg-2); font-weight:500; transition: color var(--dur-1); }
.rp-tab:hover{ color:var(--fg); }
.rp-tab[aria-selected="true"]{ color:var(--fg); }

.rp-bar .btn.scope:hover{ background:var(--hover); color:var(--fg); }
.pm{ font-size:12px; white-space:nowrap; }
.rp-body{ flex:1; overflow:auto; min-height:0; }
.rp-by{ display:flex; align-items:center; gap:7px; padding:12px 16px 6px; font-size:12px; color:var(--fg-2); }
.flist{ padding:0 8px 10px; }
.fr{ display:flex; align-items:center; gap:8px; width:100%; height:30px; padding:0 8px; border-radius:6px; font-size:12px; color:var(--fg-3); }
.fr:hover{ background:var(--hover); } .fr.sel{ background:var(--sel); }
.fr .p{ font-family:var(--mono); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg); }
.fr .p span{ color:var(--fg-3); }
.rp-note{ margin:4px 16px 16px; font-size:12px; color:var(--fg-3); line-height:17px; }
.dfile{ border-top:1px solid var(--line); }
.dfile-h{ position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:8px; height:36px; padding:0 6px 0 16px; background:var(--bg); border-bottom:1px solid var(--line); font-size:12px; }

.rp .hunk{ border-top:0; }

.rp .ln .n{ width:34px; }

.rp-foot{ flex:none; display:flex; align-items:center; gap:6px; padding:10px 12px; border-top:1px solid var(--line); }

.rp .tree{ padding:12px 12px 16px 16px; }
.rp .empty p{ max-width:40ch; }
.filter{ display:flex; align-items:center; gap:8px; flex:1; height:28px; padding:0 8px; border-radius:6px; color:var(--fg-3); background:var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line-2); }
.filter input{ flex:1; min-width:0; border:0; background:transparent; }
.filter input::placeholder{ color:var(--fg-3); }
.filter input:focus-visible{ outline:none; }
.filter:focus-within{ box-shadow: inset 0 0 0 1px var(--focus), 0 0 0 3px color-mix(in oklch, var(--focus) 25%, transparent); }
.agentchg{ flex:none; display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px 10px 16px; border-top:1px solid var(--line); text-align:left; transition: background var(--dur-1); }
.agentchg:hover{ background:var(--hover); }
.agentchg .grow{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.agentchg .t{ font-weight:600; } .agentchg .s{ font-size:12px; color:var(--fg-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ───────────── Phone: project groups + panel sheet ───────────── */
.ph-pg-h{ display:flex; align-items:center; gap:10px; width:100%; height:40px; padding:10px 20px 0; font-size:15px; color:var(--fg-2); }

.ph-pg-h .hn{ font-size:14px; color:var(--fg-3); }
.ph-pg-h .grow{ flex:1; }
.ph-pg-h .ct{ font-size:14px; color:var(--fg-3); }

.ph-pg .ph-row .row-st{ width:20px; }

.ph-row.snz{ min-height:52px; align-items:center; margin-top:8px; border-top:1px solid var(--line); }
.ph-row.snz::after{ display:none; }
.ph-chg{ display:flex; align-items:center; gap:10px; min-height:48px; padding:0 14px; margin:4px 0 14px; border-radius:12px; box-shadow: inset 0 0 0 1px var(--line); font-size:15px; font-weight:500; }
.ph-chg .pm{ font-size:14px; }
.ph-chg .grow{ flex:1; }
.ph-sheet.large{ top:54px; display:flex; flex-direction:column; padding:8px 0 0; }
.ph-sheet.large .ph-body{ padding-bottom:34px; }
.ph-sh-nav{ display:flex; align-items:center; height:44px; padding:0 8px; flex:none; }
.ph-sh-nav .ttl{ flex:1; text-align:center; font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ph-sh-nav .navbtn{ min-width:64px; height:44px; display:inline-flex; align-items:center; justify-content:flex-end; padding:0 12px; color:var(--accent-tx); font-size:17px; }
.ph-seg .seg .pip{ margin-left:2px; }
.ph-sum{ display:flex; align-items:center; gap:10px; padding:6px 16px 14px; }
.ph-sum .pm{ font-size:14px; }
.ph-sum .grow{ flex:1; }
.nav.parent{ color:var(--fg); }
.ph-group .pm{ font-size:13px; }
.ph-diff{ margin:0 16px 22px; border-radius:12px; overflow:hidden; box-shadow: inset 0 0 0 1px var(--line); }
.ph-diff .hunk{ border-top:0; font-size:12px; line-height:18px; }
.ph-diff .ln .n{ width:30px; padding-right:8px; }
.ph-diff .hh{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:6px 12px; }
.ph-node.kid{ padding-left:36px; }
.ph-node.sel{ background:var(--accent-soft); }
:root[data-theme="dark"] .ph-node.sel{ background: color-mix(in oklch, var(--accent-soft) 70%, var(--fill)); }
.ph .btn.sm{ text-decoration:none; }

/* ───────────── Phone ───────────── */
body.frame-phone{ background: var(--bg-side); }
.device{ position:absolute; left:50%; top:50%; width:390px; height:844px; margin:-422px 0 0 -195px; border-radius:52px; overflow:hidden; background:var(--bg); box-shadow: 0 0 0 1px var(--line-2), 0 0 0 10px oklch(0.16 0.004 260), 0 30px 80px -20px oklch(0 0 0 / .45); }
@media (max-width: 440px){ .device{ left:0; top:0; margin:0; width:100vw; height:100vh; border-radius:0; box-shadow:none; } }
.ph{ position:absolute; inset:0; display:flex; flex-direction:column; font-size:16px; line-height:22px; background:var(--bg); }
.ph-sb{ height:50px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:6px 30px 0 34px; font-size:16px; font-weight:600; position:relative; }
.ph-sb .isl{ position:absolute; left:50%; top:11px; width:122px; height:35px; margin-left:-61px; background:#000; border-radius:20px; }
.ph-sb .r{ display:flex; gap:6px; align-items:center; }
.ph-nav{ display:flex; align-items:center; justify-content:space-between; height:44px; padding:0 8px; flex:none; }
.ph-nav .navbtn{ min-width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; gap:2px; color:var(--accent-tx); font-size:17px; padding:0 8px; }
.ph-nav .ttl{ font-size:17px; font-weight:600; flex:1; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ph-lt{ font-size:30px; line-height:36px; font-weight:600; letter-spacing:-0.02em; padding:2px 20px 10px; flex:none; }
.ph-body{ flex:1; overflow:auto; min-height:0; }
.ph-seg{ padding:0 16px 10px; }
.ph-seg .seg button{ height:30px; font-size:14px; }
.ph-row{ display:flex; gap:12px; padding:12px 20px 13px 20px; position:relative; width:100%; min-height:66px; }

.ph-row .row-st{ height:22px; width:14px; }
.ph-row .row-title{ font-size:16px; line-height:22px; }
.ph-row .row-time,.ph-row .row-meta,.ph-row .row-status{ font-size:14px; line-height:20px; }
.ph-tabbar{ height:84px; flex:none; display:flex; border-top:1px solid var(--line); background:color-mix(in oklch, var(--bg-side) 92%, transparent); padding:6px 4px 0; }
.ph-tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; line-height:13px; font-weight:500; color:var(--fg-3); height:50px; justify-content:center; position:relative; }
.ph-tab[aria-current="page"]{ color:var(--accent-tx); }
.ph-tab .bdg{ position:absolute; top:2px; left:50%; margin-left:6px; min-width:18px; height:18px; border-radius:8px; background:var(--accent); color:var(--accent-fg); font-size:11px; line-height:18px; text-align:center; padding:0 5px; font-weight:600; }

.ph .btn{ height:44px; border-radius:12px; font-size:16px; padding:0 18px; justify-content:center; }
.ph .btn.sm{ height:34px; border-radius:8px; font-size:14px; padding:0 12px; }
.ph-group{ margin:0 16px 22px; border-radius:12px; background:var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line); overflow:hidden; }

.ph-gh{ font-size:13px; color:var(--fg-2); padding:0 32px 6px; }
.ph-li{ display:flex; align-items:center; gap:12px; min-height:48px; padding:10px 16px; position:relative; font-size:16px; }

.ph .switch{ width:51px; height:31px; border-radius:16px; }

.ph-stream{ padding:8px 16px 16px; }
.ph-stream .bubble{ font-size:16px; line-height:23px; }
.ph-stream .prose{ font-size:16px; line-height:24px; }
.ph-dock{ flex:none; padding:8px 12px 34px; border-top:1px solid var(--line); background:var(--bg); display:flex; flex-direction:column; gap:8px; }
.ph-comp{ display:flex; align-items:center; gap:8px; }
.ph-comp .in{ flex:1; height:40px; border-radius:20px; box-shadow: inset 0 0 0 1px var(--line-2); display:flex; align-items:center; padding:0 6px 0 16px; color:var(--fg-3); font-size:16px; }

.ph-ask{ border-radius:14px; background:var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line-2); padding:12px 14px; }
:root[data-theme="dark"] .ph-ask{ background:var(--fill); box-shadow:none; }
.ph-sheet{ position:absolute; left:0; right:0; bottom:0; z-index:22; background:var(--bg-raised); border-radius:14px 14px 0 0; box-shadow: var(--sh-dlg); padding:8px 0 34px; animation: rise var(--dur-3) var(--ease-out); }
:root[data-theme="dark"] .ph-sheet{ background:oklch(0.215 0.005 260); }
@keyframes rise{ from{ transform: translateY(40px); opacity:0; } }
.grab{ width:36px; height:5px; border-radius:3px; background:var(--line-2); margin:0 auto 10px; }
.keybar{ display:flex; gap:6px; padding:8px 8px; overflow-x:auto; border-top:1px solid var(--line); background:var(--bg-side); }
.key{ height:44px; min-width:44px; padding:0 12px; border-radius:8px; background:var(--bg-raised); box-shadow: 0 1px 0 var(--line-2), inset 0 0 0 1px var(--line); font-size:14px; font-weight:500; display:inline-grid; place-items:center; flex:none; }

/* ───────────── Prototype chrome ───────────── */
.proto{ position:fixed; right:12px; bottom:12px; z-index:100; display:flex; align-items:center; gap:4px; padding:4px; border-radius:12px; background:var(--bg-raised); box-shadow: var(--sh-pop), inset 0 0 0 1px var(--line); font-size:12px; opacity:.55; transition: opacity var(--dur-2); }
.proto:hover,.proto:focus-within{ opacity:1; }
.proto select{ height:26px; border-radius:6px; border:0; background:var(--fill); padding:0 6px; font-size:12px; max-width:220px; }
.proto .ibtn{ width:26px; height:26px; }
body.shot .proto{ display:none; }
</style>

function drawChart(){

    return;
  }
  const W = el.clientWidth, H = 220, pl=36, pb=24, pt=6, cw=W-pl, ch=H-pb-pt;
  const tot = DAYS.map((_,i)=>SERIES.reduce((a,s)=>a+s.v[i],0)); const max=200;
  const bw = Math.min(28, cw/DAYS.length - 10), step = cw/DAYS.length;
  let g='';
  [0,50,100,150,200].forEach(v=>{ const y=pt+ch-(v/max)*ch; g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" ${v?'':'stroke="var(--line-2)"'}/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--fg-3)">${v?v+'k':'0'}</text>`; });
  DAYS.forEach((d,i)=>{
    const x = pl + i*step + (step-bw)/2; let y = pt+ch;
    const segs = SERIES.map(s=>s.v[i]).map((v,k)=>({v,k})).filter(o=>o.v>0);
    segs.forEach((o,j)=>{ const h=(o.v/max)*ch; const gap = j? 2:0; const top = j===segs.length-1;
      const hh = Math.max(0,h-gap); y -= h;
      if(top){ const r=Math.min(3,hh); g+=`<path d="M${x},${y+gap+hh} V${y+gap+r} Q${x},${y+gap} ${x+r},${y+gap} H${x+bw-r} Q${x+bw},${y+gap} ${x+bw},${y+gap+r} V${y+gap+hh} Z" fill="var(${SERIES[o.k].c})"/>`; }
      else g+=`<rect x="${x}" y="${y+gap}" width="${bw}" height="${hh}" fill="var(${SERIES[o.k].c})"/>`;
    });
    if(i%2===0||i===DAYS.length-1) g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--fg-3)">${d.replace('Nov ','')}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${pl+i*step}" y="${pt}" width="${step}" height="${ch}" fill="transparent"/>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Tokens per day by harness, Oct 30 to Nov 12. Weekdays run 120 to 190 thousand tokens; weekends drop below 40 thousand." style="font-family:var(--font);font-variant-numeric:tabular-nums">${g}</svg>`;
  const tip = document.getElementById('tip');
  el.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('mouseenter', ()=>{ const i=+r.dataset.i; tip.style.display='block';
      tip.innerHTML = `<div style="font-weight:600;margin-bottom:4px">${DAYS[i]} <span class="faint" style="font-weight:400">· ${tot[i]}k</span></div>` + SERIES.map(s=>`<div class="r"><span><i style="background:var(${s.c})"></i>${s.k}</span><span class="num">${s.v[i]}k</span></div>`).join('');
      const x = pl + i*step + step/2; tip.style.left = Math.min(W-180, x+12)+'px'; tip.style.top = '60px'; r.setAttribute('fill','color-mix(in oklch, var(--fg) 5%, transparent)'); });
    r.addEventListener('mouseleave', ()=>{ tip.style.display='none'; r.setAttribute('fill','transparent'); });
  });
}

function qrSVG(seed='pair:7K4Q2M9P'){
  const N=25; let h=hash(seed); const rnd=()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return (h>>>0)/4294967296; };
  let s=''; const finder=(x,y)=>{ s+=`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`; };
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9); if(inF) continue; if(x===6||y===6){ if((x+y)%2===0) s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`; continue; } if(rnd()<0.5) s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`; }
  finder(0,0); finder(N-7,0); finder(0,N-7);
  s+=`<rect x="16" y="16" width="5" height="5" fill="#111"/><rect x="17" y="17" width="3" height="3" fill="#fff"/><rect x="18" y="18" width="1" height="1" fill="#111"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" width="100%" height="100%" shape-rendering="crispEdges" role="img" aria-label="Pairing QR code for atlas">${s}</svg>`;
}

  ]],
];
const FLAT = Object.fromEntries(SCREENS.flatMap(([g,l])=>l.map(([id,lab,x])=>[id,{lab, fn: typeof x==='function'?x:shell, preset: typeof x==='function'?null:x, phone:g==='Phone'}])));
const ALIAS = { 'set-general':'set-hosts','set-appearance':'set-hosts','set-notif':'set-hosts','set-keys':'set-hosts','set-account':'set-hosts','skills':'library', 'p-pr':'p-inbox','p-more':'p-pairing' };
const PHONE_MAP = { inbox:'p-inbox', 'inbox-done':'p-inbox', 'panel-changes':'p-changes', subagents:'p-subagents', terminal:'p-terminal', usage:'p-usage', 'set-devices':'p-pairing', palette:'p-inbox', 'sidebar-collapsed':'p-thread', ide:'p-changes', 'ide-switch':'p-inbox' };
const DESK_MAP = { 'p-inbox':'inbox','p-thread':'inbox','p-approval':'inbox','p-changes':'panel-changes','p-subagents':'subagents','p-terminal':'terminal','p-pairing':'set-devices','p-usage':'usage' };

/* ───────────── Render + interactions ───────────── */
const stage = document.getElementById('stage');
function render(){
  const id = FLAT[S.screen] ? S.screen : 'inbox';
  const sc = FLAT[id];
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle('frame-phone', sc.phone);
  stage.innerHTML = sc.fn();
  document.getElementById('pick').value = id;
  document.getElementById('tgTheme').innerHTML = ic(S.theme==='dark'?'sun':'moon',14);
  document.getElementById('tgFrame').innerHTML = ic(sc.phone?'monitor':'phone',14);
  drawChart(); tick(); glyphKbd();
  document.querySelectorAll('.stream, .ph-body.tail').forEach(e=>e.scrollTop=e.scrollHeight);
  const u = new URLSearchParams(location.hash.slice(1)); u.set('s',id); u.set('t',S.theme); history.replaceState(null,'','#'+u.toString());
}
function go(id){
  id = ALIAS[id] || id; if(!FLAT[id]) return;
  S.screen = id; Object.assign(S, base(), FLAT[id].preset || {}); render();
}
const onShell = () => !!FLAT[S.screen]?.preset;
function toShell(){ if(!onShell()){ const keep = { sel:S.sel, tab:S.tab }; go('inbox'); Object.assign(S, keep); } }
const KG = { '⌘':P.cmd, '⌥':'<path d="M3 5h6l6 14h6"/><path d="M14 5h7"/>', '↵':'<polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>', '⌫':'<path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/>', '⇧':'<path d="M9 18v-6H5l7-7 7 7h-4v6H9z"/>', '↑':'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>', '↓':'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>' };
function glyphKbd(){ document.querySelectorAll('.kbd').forEach(k=>{ if(k.dataset.g) return; k.dataset.g=1; const raw=k.textContent; k.innerHTML = [...raw].map(c=>KG[c]?`<svg viewBox="0 0 24 24" aria-hidden="true">${KG[c]}</svg>`:c).join(''); k.setAttribute('aria-label', raw.replace('⌘','Command ').replace('⌥','Option ').replace('↵','Return').replace('⌫','Backspace').replace('⇧','Shift ')); }); }
function tick(){
  const n = nowMs();
  document.querySelectorAll('[data-countdown="resume"]').forEach(e=>e.textContent = hms(RESUME_AT-n));
  document.querySelectorAll('[data-countdown="resume-short"]').forEach(e=>e.textContent = hms(RESUME_AT-n,false));
  document.querySelectorAll('[data-countdown="pair"]').forEach(e=>e.textContent = hms(PAIR_EXP-n));
}
setInterval(tick, 1000);
const pick = document.getElementById('pick');
pick.innerHTML = SCREENS.map(([g,l])=>`<optgroup label="${g}">${l.map(([id,lab])=>`<option value="${id}">${lab}</option>`).join('')}</optgroup>`).join('');
pick.onchange = () => go(pick.value);
document.getElementById('tgTheme').onclick = () => { S.theme = S.theme==='dark'?'light':'dark'; render(); };
document.getElementById('tgFrame').onclick = () => { const ph = FLAT[S.screen]?.phone; go(ph ? (DESK_MAP[S.screen]||'inbox') : (PHONE_MAP[S.screen]||'p-inbox')); };
function setView(v){ toShell(); S.view = v; if(v==='ide' && !S.panel) S.panel = 'files'; render(); }
document.addEventListener('click', e=>{
  const el = s => e.target.closest(s);
  const goEl = el('[data-go]'), act = el('[data-act]'), tab = el('[data-tab]'), row = el('[data-thread]'), proj = el('[data-proj]'), ptab = el('[data-ptab]'), tool = el('.tool');
  if(proj){ e.preventDefault(); const k=proj.dataset.proj; S.closed[k] = !S.closed[k]; render(); return; }
  if(row){ e.preventDefault(); S.sel = row.dataset.thread; toShell(); render(); return; }
  if(ptab){ e.preventDefault(); toShell(); S.panel = ptab.dataset.ptab; render(); return; }
  if(goEl && goEl.dataset.go){ e.preventDefault(); go(goEl.dataset.go); return; }
  if(tab){ S.tab = tab.dataset.tab; render(); return; }
  if(act){ e.preventDefault(); const a = act.dataset.act;
    if(a==='palette') go('palette');
    if(a==='closepal') go('inbox');
    if(a==='side'){ toShell(); S.side = !S.side; render(); }
    if(a==='panel'){ toShell(); S.panel = S.panel ? null : (S.view==='ide'?'files':'changes'); render(); }
    if(a==='term'){ toShell(); S.term = !S.term; render(); }
    if(a==='view-ide') setView('ide');
    if(a==='view-thread') setView('thread');
    if(a==='open-changes'){ S.panel='changes'; render(); }
    if(a==='open-subagents'){ S.panel='subagents'; render(); }
    if(a==='approve'){ const c=act.closest('.ask'); c.classList.add('gone'); document.getElementById('live').textContent='Approved. Codex is running the command on orion.'; setTimeout(()=>{ S.approved=true; render(); }, 200); }
    if(a==='deny'){ document.getElementById('live').textContent='Denied. The subagent stopped; the parent keeps running.'; }
    if(a==='undo'){ S.approved=false; render(); }
    if(a==='charttable'){ S.chartTable=!S.chartTable; render(); }
    return; }
  if(tool && tool.hasAttribute('aria-expanded')){ tool.setAttribute('aria-expanded', tool.getAttribute('aria-expanded')!=='true'); }
});
document.addEventListener('keydown', e=>{
  const mod = e.metaKey || e.ctrlKey, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const rz = e.target.closest && e.target.closest('.rz');
  if(rz && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); const side = rz.dataset.rz==='side', d = (e.key==='ArrowRight'?16:-16)*(side?1:-1);
    if(side) S.sideW = Math.max(240, Math.min(420, S.sideW+d)); else S.rpW = Math.max(320, Math.min(640, S.rpW+d));
    rz.parentElement.style.setProperty(side?'--side-w':'--rp-w', (side?S.sideW:S.rpW)+'px'); rz.setAttribute('aria-valuenow', side?S.sideW:S.rpW); return; }
  if(mod && e.code==='KeyK'){ e.preventDefault(); go(S.screen==='palette'?'inbox':'palette'); return; }
  if(e.key==='Escape' && S.screen==='palette'){ go('inbox'); return; }
  if(mod && e.shiftKey && e.code==='KeyL'){ e.preventDefault(); S.theme = S.theme==='dark'?'light':'dark'; render(); return; }
  if(FLAT[S.screen]?.phone) return;
  if(mod && e.altKey && e.code==='KeyB'){ e.preventDefault(); toShell(); S.panel = S.panel ? null : (S.view==='ide'?'files':'changes'); render(); return; }
  if(mod && e.code==='KeyB'){ e.preventDefault(); toShell(); S.side = !S.side; render(); return; }
  if(mod && e.code==='KeyE'){ e.preventDefault(); setView(S.view==='ide'?'thread':'ide'); return; }
  if(mod && e.code==='KeyJ'){ e.preventDefault(); toShell(); S.panel = 'subagents'; render(); return; }
  if(!mod && !typing && e.code==='KeyD'){ toShell(); S.panel = 'changes'; render(); return; }
  if(!mod && !typing && e.code==='KeyT'){ toShell(); S.term = !S.term; render(); return; }
});
document.addEventListener('pointerdown', e=>{
  const h = e.target.closest('.rz'); if(!h) return;
  e.preventDefault();
  const side = h.dataset.rz==='side', pane = h.parentElement, x0 = e.clientX, w0 = pane.getBoundingClientRect().width;
  h.classList.add('drag'); h.setPointerCapture(e.pointerId);
  const mv = ev => { const dx = ev.clientX - x0; const w = Math.round(side ? Math.max(240, Math.min(420, w0+dx)) : Math.max(320, Math.min(640, w0-dx)));
    pane.style.setProperty(side?'--side-w':'--rp-w', w+'px'); h.setAttribute('aria-valuenow', w); if(side) S.sideW = w; else S.rpW = w; };
  const up = () => { h.classList.remove('drag'); h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); };
  h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
});
window.addEventListener('resize', ()=>drawChart());
(function init(){
  const u = new URLSearchParams(location.hash.slice(1));
  S.theme = u.get('t') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  if(u.get('ui')==='0') document.body.classList.add('shot');
  if(u.get('still')==='1') document.body.classList.add('still');
  document.fonts?.ready.then(()=>drawChart());
  go(u.get('s') || 'inbox');
})();
</script>
</body>
