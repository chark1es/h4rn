<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h4rn · Quiet native</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────────── Tokens ───────────── */
:root{
  color-scheme: light;
  --bg:        oklch(0.995 0.0015 260);
  --bg-side:   oklch(0.970 0.0025 260);
  --bg-raised: oklch(1 0 0);
  --bg-sunk:   oklch(0.978 0.002 260);
  --fill:      oklch(0.955 0.003 260);
  --fill-2:    oklch(0.925 0.004 260);
  --hover:     oklch(0.962 0.003 260);
  --sel:       oklch(0.940 0.004 260);
  --line:      oklch(0.915 0.003 260);
  --line-2:    oklch(0.860 0.004 260);
  --fg:        oklch(0.210 0.006 260);
  --fg-2:      oklch(0.440 0.007 260);
  --fg-3:      oklch(0.510 0.007 260);
  --accent:    oklch(0.540 0.180 258);
  --accent-hi: oklch(0.490 0.180 258);
  --accent-fg: oklch(0.995 0 0);
  --accent-tx: oklch(0.500 0.170 258);
  --accent-soft: oklch(0.955 0.024 258);
  --focus:     oklch(0.600 0.170 258);
  --warn:      oklch(0.500 0.110 62);
  --warn-dot:  oklch(0.760 0.150 72);
  --warn-soft: oklch(0.968 0.030 80);
  --ok:        oklch(0.490 0.120 150);
  --ok-dot:    oklch(0.640 0.150 150);
  --danger:    oklch(0.520 0.190 27);
  --danger-soft: oklch(0.966 0.020 25);
  --add-bg:    oklch(0.966 0.028 150);
  --del-bg:    oklch(0.966 0.020 25);
  --add-tx:    oklch(0.450 0.120 150);
  --del-tx:    oklch(0.500 0.180 27);
  --syn-kw:    oklch(0.470 0.150 300);
  --syn-str:   oklch(0.480 0.110 150);
  --syn-fn:    oklch(0.470 0.130 250);
  --syn-cm:    oklch(0.520 0.010 260);
  --scrim:     oklch(0.20 0.01 260 / 0.28);
  --sh-pop:    0 1px 2px oklch(0.2 0.01 260 / .06), 0 10px 28px -10px oklch(0.2 0.01 260 / .22);
  --sh-dlg:    0 2px 8px oklch(0.2 0.01 260 / .08), 0 28px 64px -16px oklch(0.2 0.01 260 / .32);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#6250d6;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --dur-1: 120ms; --dur-2: 180ms; --dur-3: 240ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: dark; } }
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        oklch(0.190 0.004 260);
  --bg-side:   oklch(0.163 0.004 260);
  --bg-raised: oklch(0.232 0.005 260);
  --bg-sunk:   oklch(0.172 0.004 260);
  --fill:      oklch(0.240 0.005 260);
  --fill-2:    oklch(0.285 0.006 260);
  --hover:     oklch(0.222 0.005 260);
  --sel:       oklch(0.252 0.006 260);
  --line:      oklch(0.268 0.005 260);
  --line-2:    oklch(0.345 0.006 260);
  --fg:        oklch(0.945 0.003 260);
  --fg-2:      oklch(0.760 0.005 260);
  --fg-3:      oklch(0.640 0.006 260);
  --accent:    oklch(0.560 0.170 258);
  --accent-hi: oklch(0.610 0.170 258);
  --accent-tx: oklch(0.760 0.120 258);
  --accent-soft: oklch(0.275 0.050 258);
  --focus:     oklch(0.700 0.140 258);
  --warn:      oklch(0.830 0.120 80);
  --warn-dot:  oklch(0.790 0.140 76);
  --warn-soft: oklch(0.265 0.035 75);
  --ok:        oklch(0.780 0.130 150);
  --ok-dot:    oklch(0.700 0.140 150);
  --danger:    oklch(0.730 0.150 25);
  --danger-soft: oklch(0.262 0.040 25);
  --add-bg:    oklch(0.245 0.032 150);
  --del-bg:    oklch(0.245 0.032 25);
  --add-tx:    oklch(0.790 0.130 150);
  --del-tx:    oklch(0.750 0.140 25);
  --syn-kw:    oklch(0.780 0.110 300);
  --syn-str:   oklch(0.790 0.110 150);
  --syn-fn:    oklch(0.790 0.100 250);
  --syn-cm:    oklch(0.620 0.010 260);
  --scrim:     oklch(0.05 0.01 260 / 0.5);
  --sh-pop:    0 1px 2px oklch(0 0 0 / .3), 0 12px 32px -10px oklch(0 0 0 / .6);
  --sh-dlg:    0 2px 8px oklch(0 0 0 / .35), 0 28px 64px -16px oklch(0 0 0 / .7);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
}

/* ───────────── Base ───────────── */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  background:var(--bg); color:var(--fg);
  font: 400 13px/18px var(--font);
  font-feature-settings: "tnum" 1, "cv11" 1;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow:hidden;
}
::selection{ background: var(--accent-soft); color: var(--fg); }
button,input,textarea,select{ font:inherit; color:inherit; }
a{ color:inherit; text-decoration:none; }
a.t-accent:hover{ text-decoration:underline; text-underline-offset:2px; }
.kbd svg{ width:11px; height:11px; vertical-align:-1.5px; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
button{ background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
:focus{ outline:none; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }
code,.mono{ font-family:var(--mono); font-size:12px; font-feature-settings:"tnum" 1, "zero" 0; }
.num{ font-variant-numeric: tabular-nums; }
svg.i{ width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
svg.i.s14{ width:14px; height:14px; } svg.i.s12{ width:12px; height:12px; } svg.i.s18{ width:18px; height:18px; } svg.i.s20{ width:20px; height:20px; } svg.i.s22{ width:22px; height:22px; } svg.i.s24{width:24px;height:24px;}
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:12px; border:3px solid transparent; background-clip:content-box; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.muted{ color:var(--fg-2); } .faint{ color:var(--fg-3); }
.t-warn{ color:var(--warn); } .t-ok{ color:var(--ok); } .t-danger{ color:var(--danger); } .t-accent{ color:var(--accent-tx); }
.sep{ color:var(--line-2); margin:0 6px; }
.dot{ width:6px; height:6px; border-radius:50%; display:inline-block; flex:none; background:var(--fg-3); }
.dot.on{ background:var(--ok-dot); } .dot.off{ background:transparent; box-shadow: inset 0 0 0 1.5px var(--fg-3); } .dot.warn{ background:var(--warn-dot); } .dot.you{ background:var(--accent); width:8px; height:8px; }

/* ───────────── Controls ───────────── */
.btn{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:6px; font-weight:500; white-space:nowrap;
  transition: background var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out), color var(--dur-1); }
.btn.primary{ background:var(--accent); color:var(--accent-fg); }
.btn.primary:hover{ background:var(--accent-hi); }
.btn.secondary{ background:var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 0 oklch(0.2 0.01 260 / .04); }
.btn.secondary:hover{ background:var(--hover); }
.btn.ghost{ color:var(--fg-2); }
.btn.ghost:hover{ background:var(--hover); color:var(--fg); }
.btn.danger{ color:var(--danger); box-shadow: inset 0 0 0 1px var(--line-2); background:var(--bg-raised); }
.btn.danger:hover{ background:var(--danger-soft); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn .kbd{ margin-left:2px; }
.btn.primary .kbd{ color: oklch(1 0 0 / .78); border-color: oklch(1 0 0 / .3); }
.ibtn{ width:28px; height:28px; display:inline-grid; place-items:center; border-radius:6px; color:var(--fg-2); transition: background var(--dur-1), color var(--dur-1); }
.ibtn:hover{ background:var(--hover); color:var(--fg); }
.ibtn.on{ background:var(--fill); color:var(--fg); }
.kbd{ font: 500 11px/16px var(--font); color:var(--fg-3); padding:0 4px; border-radius:4px; box-shadow: inset 0 0 0 1px var(--line); min-width:18px; text-align:center; display:inline-block; letter-spacing:.02em; }
.seg{ display:flex; padding:2px; gap:2px; background:var(--fill); border-radius:8px; }
.seg button{ flex:1; height:24px; border-radius:6px; color:var(--fg-2); font-weight:500; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 10px; transition: background var(--dur-1), color var(--dur-1); white-space:nowrap; }
.seg button:hover{ color:var(--fg); }
.seg button[aria-selected="true"]{ background:var(--bg-raised); color:var(--fg); box-shadow: 0 1px 2px oklch(0.2 0.01 260 / .12), 0 0 0 .5px oklch(0.2 0.01 260 / .08); }
:root[data-theme="dark"] .seg button[aria-selected="true"]{ background: var(--fill-2); box-shadow:none; }
.seg .c{ color:var(--fg-3); font-weight:400; }
.seg.inline{ display:inline-flex; } .seg.inline button{ flex:none; }
.input{ height:28px; border-radius:6px; padding:0 10px; background:var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line-2); border:0; width:100%; }
.input:focus-visible{ outline:none; box-shadow: inset 0 0 0 1px var(--focus), 0 0 0 3px color-mix(in oklch, var(--focus) 25%, transparent); }
.switch{ display:inline-block; vertical-align:middle; width:30px; height:18px; border-radius:8px; background:var(--fill-2); position:relative; flex:none; box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--fg) 12%, transparent); transition: background var(--dur-2) var(--ease-out); }
.switch::after{ content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 2px oklch(0 0 0 / .25); transition: transform var(--dur-2) var(--ease-out); }
.switch[aria-checked="true"]{ background:var(--accent); box-shadow:none; }
.switch[aria-checked="true"]::after{ transform: translateX(12px); }
.switch[aria-disabled="true"]{ opacity:.4; cursor:not-allowed; }
.check{ width:16px; height:16px; border-radius:4px; box-shadow: inset 0 0 0 1px var(--line-2); display:inline-grid; place-items:center; flex:none; background:var(--bg-raised); color:var(--accent-fg); }
.check.on{ background:var(--accent); box-shadow:none; }
.badge{ display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 6px; border-radius:4px; font-size:12px; font-weight:500; color:var(--fg-2); background:var(--fill); white-space:nowrap; }
.badge.warn{ color:var(--warn); background:var(--warn-soft); }
.badge.danger{ color:var(--danger); background:var(--danger-soft); }
.badge.ok{ color:var(--ok); background: color-mix(in oklch, var(--ok-dot) 14%, var(--bg)); }
.badge.you{ color:var(--accent-tx); background:var(--accent-soft); }

/* ───────────── Identity + state placeholders ───────────── */
.blob{ display:inline-block; flex:none; vertical-align:-3px; }
.blob .b{ fill: oklch(0.80 0.085 var(--h)); }
.blob .e{ fill: oklch(0.26 0.03 var(--h)); }
:root[data-theme="dark"] .blob .b{ fill: oklch(0.70 0.090 var(--h)); }
:root[data-theme="dark"] .blob .e{ fill: oklch(0.18 0.02 var(--h)); }
.orb{ position:relative; display:inline-block; width:14px; height:14px; flex:none; color:var(--fg-2); }
.orb::before{ content:""; position:absolute; inset:4px; border-radius:50%; background:currentColor; opacity:.9; }
.orb i{ position:absolute; inset:0; border-radius:50%; transform: rotate(50deg); animation: orbit 1.4s linear infinite; }
.orb i::after{ content:""; position:absolute; top:0; left:50%; width:3px; height:3px; margin-left:-1.5px; border-radius:50%; background:currentColor; }
.orb i:nth-child(2){ animation-duration:2.1s; animation-direction:reverse; inset:1px; transform: rotate(230deg); }
.orb i:nth-child(2)::after{ opacity:.55; }
.orb.queued::before{ animation: breathe 2.4s ease-in-out infinite; } .orb.queued i{ display:none; }
.orb.held::before{ inset:3px; background:transparent; box-shadow: inset 0 0 0 1.5px currentColor; } .orb.held i{ display:none; }
.orb.lg{ width:20px; height:20px; } .orb.lg::before{ inset:6px; } .orb.lg i::after{ width:4px; height:4px; margin-left:-2px; }
@keyframes orbit{ from{ transform: rotate(50deg); } to{ transform: rotate(410deg); } }
@keyframes breathe{ 50%{ transform: scale(.6); opacity:.5; } }
.caret{ display:inline-block; width:2px; height:1.05em; background:var(--fg); vertical-align:-2px; margin-left:1px; animation: blink 1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.skel{ background:var(--fill); border-radius:4px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse{ 50%{ opacity:.55; } }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition-duration:1ms !important; }
  .skel{ opacity:.7; }
}
body.still *, body.still *::before, body.still *::after{ animation-play-state: paused !important; }

/* ───────────── Desktop shell ───────────── */
#stage{ position:fixed; inset:0; }
.app{ display:flex; height:100%; width:100%; background:var(--bg); }
.side{ width:212px; flex:none; background:var(--bg-side); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:10px 8px 8px; gap:2px; }
.side-top{ display:flex; align-items:center; justify-content:space-between; height:32px; padding:0 4px 0 8px; margin-bottom:4px; }
.word{ font-weight:600; font-size:14px; letter-spacing:-0.01em; }
.side-search{ display:flex; align-items:center; gap:8px; height:28px; padding:0 8px; border-radius:6px; color:var(--fg-3); background:var(--bg); box-shadow: inset 0 0 0 1px var(--line); margin-bottom:10px; }
.side-search span:first-of-type{ flex:1; }
.nav{ display:flex; align-items:center; gap:9px; height:28px; padding:0 8px; border-radius:6px; color:var(--fg-2); font-weight:500; transition: background var(--dur-1); }
.nav:hover{ background:var(--hover); color:var(--fg); }
.nav[aria-current="page"]{ background:var(--fill-2); color:var(--fg); }
:root[data-theme="dark"] .nav[aria-current="page"]{ background:var(--sel); }
.nav .lbl{ flex:1; }
.nav .ct{ color:var(--fg-3); font-weight:400; }
.nav .ct.you{ color:var(--accent-tx); font-weight:600; }
.side-h{ font-size:12px; color:var(--fg-3); font-weight:500; padding:16px 8px 4px; display:flex; justify-content:space-between; align-items:center; }
.host{ display:flex; align-items:center; gap:8px; height:28px; padding:0 8px; border-radius:6px; color:var(--fg-2); }
.host:hover{ background:var(--hover); }
.host .lbl{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.host.sub{ padding-left:22px; }
.host .meta{ font-size:12px; color:var(--fg-3); }
.side-foot{ margin-top:auto; display:flex; flex-direction:column; gap:2px; }
.conn{ display:flex; align-items:center; gap:8px; padding:6px 8px 2px; font-size:12px; color:var(--fg-3); }

.pane{ width:328px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--bg); }
.pane-head{ display:flex; align-items:center; gap:4px; height:52px; padding:0 10px 0 16px; flex:none; }
.pane-head h2{ margin:0; font-size:15px; font-weight:600; letter-spacing:-0.01em; flex:1; }
.pane-sub{ padding:0 12px 10px; flex:none; }
.scroll{ overflow:auto; min-height:0; flex:1; }
.main{ flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; position:relative; }

/* thread rows */
.rows{ padding:2px 6px 8px; }
.row{ display:flex; gap:10px; width:100%; padding:9px 10px 10px; border-radius:8px; position:relative; transition: background var(--dur-1); }
.row:hover{ background:var(--hover); }
.row.sel{ background:var(--sel); }
.row + .row::before{ content:""; position:absolute; top:0; left:34px; right:10px; height:1px; background:var(--line); }
.row.sel::before, .row.sel + .row::before, .row:hover::before, .row:hover + .row::before{ opacity:0; }
.row-st{ width:14px; height:18px; display:grid; place-items:center; flex:none; color:var(--fg-3); }
.row-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.row-l1,.row-l2{ display:flex; align-items:baseline; gap:8px; min-width:0; }
.row-title{ flex:1; min-width:0; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row.dim .row-title{ color:var(--fg-2); font-weight:400; }
.row-time{ font-size:12px; color:var(--fg-3); flex:none; }
.row-meta{ flex:1; min-width:0; font-size:12px; color:var(--fg-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-status{ font-size:12px; color:var(--fg-3); flex:none; }
.row-status.you{ color:var(--accent-tx); font-weight:500; }
.row-status.warn{ color:var(--warn); } .row-status.danger{ color:var(--danger); }
.row-act{ margin-top:6px; display:flex; gap:6px; }
.row-act .btn{ height:24px; padding:0 8px; font-size:12px; }
.snoozed{ display:flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-top:1px solid var(--line); color:var(--fg-2); flex:none; }
.snoozed span:nth-child(2){ flex:1; }

/* thread detail */
.th-head{ display:flex; align-items:center; gap:12px; padding:10px 12px 10px 24px; min-height:60px; border-bottom:1px solid var(--line); flex:none; }
.main{ container-type:inline-size; }
@container (max-width: 640px){ .main .prov .opt, .main .prov .br{ display:none; } .usage-foot .opt{ display:none; } }
.th-titles{ flex:1; min-width:0; }
.th-titles h1{ margin:0; font-size:15px; line-height:20px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prov{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--fg-2); margin-top:3px; white-space:nowrap; overflow:hidden; }
.prov .sep{ margin:0 2px; }
.prov .br{ display:inline-flex; align-items:center; gap:4px; }
.th-state{ display:flex; align-items:center; gap:7px; font-weight:500; color:var(--fg-2); padding-right:6px; white-space:nowrap; }
.th-actions{ display:flex; align-items:center; gap:2px; }
.vsep{ width:1px; height:18px; background:var(--line); margin:0 6px; }
.stream{ flex:1; overflow:auto; min-height:0; }
.col{ max-width:720px; margin:0 auto; padding:0 32px; }
.stream .col{ padding-top:28px; padding-bottom:20px; }
.turn{ margin-bottom:28px; }
.you-msg{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.bubble{ background:var(--fill); padding:9px 14px; border-radius:14px; font-size:14px; line-height:21px; max-width:84%; }
.you-meta{ font-size:12px; color:var(--fg-3); display:flex; gap:8px; align-items:center; }
.attach{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 9px 0 8px; border-radius:6px; box-shadow: inset 0 0 0 1px var(--line); font-size:12px; color:var(--fg-2); background:var(--bg); }
.ag-head{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--fg-3); margin-bottom:8px; }
.ag-head b{ color:var(--fg-2); font-weight:500; }
.prose{ font-size:14px; line-height:22px; margin:0 0 12px; text-wrap:pretty; }
.prose code{ font-size:12.5px; background:var(--fill); padding:1px 5px; border-radius:4px; }
.tools{ margin:4px 0 14px; }
.tool{ display:flex; align-items:center; gap:10px; height:28px; padding:0 8px; margin:0 -8px; border-radius:6px; font-size:13px; color:var(--fg-2); width:calc(100% + 16px); }
.tool:hover{ background:var(--hover); }
.tool .verb{ width:44px; flex:none; color:var(--fg-2); }
.tool .tgt{ font-family:var(--mono); font-size:12px; color:var(--fg); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tool .m{ font-size:12px; color:var(--fg-3); flex:none; }
.tool .st{ width:16px; display:grid; place-items:center; color:var(--fg-3); flex:none; }
.tool .chev{ color:var(--fg-3); opacity:0; transition: opacity var(--dur-1), transform var(--dur-2) var(--ease-out); flex:none; }
.tool:hover .chev{ opacity:1; }
.tool[aria-expanded="true"] .chev{ opacity:1; transform: rotate(90deg); }

.ph-seg{ padding:0 16px 10px; }
.ph-seg .seg button{ height:30px; font-size:14px; }
.ph-row{ display:flex; gap:12px; padding:12px 20px 13px 20px; position:relative; width:100%; min-height:66px; }

.ph-tab[aria-current="page"]{ color:var(--accent-tx); }
.ph-tab .bdg{ position:absolute; top:2px; left:50%; margin-left:6px; min-width:18px; height:18px; border-radius:8px; background:var(--accent); color:var(--accent-fg); font-size:11px; line-height:18px; text-align:center; padding:0 5px; font-weight:600; }
.home{ position:absolute; bottom:8px; left:50%; width:136px; height:5px; margin-left:-68px; border-radius:3px; background:var(--fg); opacity:.85; z-index:40; }
.ph .btn{ height:44px; border-radius:12px; font-size:16px; padding:0 18px; justify-content:center; }
.ph .btn.sm{ height:34px; border-radius:8px; font-size:14px; padding:0 12px; }
.ph-group{ margin:0 16px 22px; border-radius:12px; background:var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line); overflow:hidden; }
:root[data-theme="dark"] .ph-group{ background:var(--fill); box-shadow:none; }
.ph-gh{ font-size:13px; color:var(--fg-2); padding:0 32px 6px; }
.ph-li{ display:flex; align-items:center; gap:12px; min-height:48px; padding:10px 16px; position:relative; font-size:16px; }
.ph-li + .ph-li::before{ content:""; position:absolute; top:0; left:16px; right:0; height:1px; background:var(--line); }
.ph-li .grow{ flex:1; min-width:0; }
.ph-li .s{ font-size:13px; color:var(--fg-2); line-height:18px; margin-top:1px; }
.ph .switch{ width:51px; height:31px; border-radius:16px; }
.ph .switch::after{ width:27px; height:27px; top:2px; left:2px; }
.ph .switch[aria-checked="true"]::after{ transform: translateX(20px); }
.ph-stream{ padding:8px 16px 16px; }
.ph-stream .bubble{ font-size:16px; line-height:23px; }
.ph-stream .prose{ font-size:16px; line-height:24px; }
.ph-dock{ flex:none; padding:8px 12px 34px; border-top:1px solid var(--line); background:var(--bg); display:flex; flex-direction:column; gap:8px; }
.ph-comp{ display:flex; align-items:center; gap:8px; }
.ph-comp .in{ flex:1; height:40px; border-radius:20px; box-shadow: inset 0 0 0 1px var(--line-2); display:flex; align-items:center; padding:0 6px 0 16px; color:var(--fg-3); font-size:16px; }

:root[data-theme="dark"] .ph-ask{ background:var(--fill); box-shadow:none; }

@keyframes rise{ from{ transform: translateY(40px); opacity:0; } }
.grab{ width:36px; height:5px; border-radius:3px; background:var(--line-2); margin:0 auto 10px; }
.keybar{ display:flex; gap:6px; padding:8px 8px; overflow-x:auto; border-top:1px solid var(--line); background:var(--bg-side); }
.key{ height:44px; min-width:44px; padding:0 12px; border-radius:8px; background:var(--bg-raised); box-shadow: 0 1px 0 var(--line-2), inset 0 0 0 1px var(--line); font-size:14px; font-weight:500; display:inline-grid; place-items:center; flex:none; }
.key.on{ background:var(--accent-soft); color:var(--accent-tx); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 40%, transparent); }

function qrSVG(seed='pair:7K4Q2M9P'){
  const N=25; let h=hash(seed); const rnd=()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return (h>>>0)/4294967296; };
  let s=''; const finder=(x,y)=>{ s+=`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`; };
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9); if(inF) continue; if(x===6||y===6){ if((x+y)%2===0) s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`; continue; } if(rnd()<0.5) s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`; }
  finder(0,0); finder(N-7,0); finder(0,N-7);
  s+=`<rect x="16" y="16" width="5" height="5" fill="#111"/><rect x="17" y="17" width="3" height="3" fill="#fff"/><rect x="18" y="18" width="1" height="1" fill="#111"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" width="100%" height="100%" shape-rendering="crispEdges" role="img" aria-label="Pairing QR code for atlas">${s}</svg>`;
}

  const mini = (l, v, s) => `<div style="padding:12px 16px"><div class="muted" style="font-size:13px">${l}</div><div class="num" style="font-size:22px;font-weight:600;letter-spacing:-0.015em;margin-top:2px">${v}</div><div class="faint" style="font-size:13px">${s}</div></div>`;
  const bars = SERIES[0].v.map((_,i)=>SERIES.reduce((a,s)=>a+s.v[i],0));
  const W=326,H=112; const bw=14, step=W/bars.length;
  let svg=''; bars.forEach((v,i)=>{ let y=H-16; SERIES.forEach((s,k)=>{ const h=s.v[i]/200*(H-20); if(!h) return; y-=h; svg+=`<rect x="${i*step+(step-bw)/2}" y="${y+(k?1:0)}" width="${bw}" height="${Math.max(0,h-(k?1:0))}" fill="var(${s.c})" ${k===3?'rx="2"':''}/>`; }); });
  return phone(`${phStatus()}
    <div class="ph-nav"><span></span><span class="ttl"></span><button class="navbtn">14 days ${ic('cd',16)}</button></div>
    <div class="ph-lt">Usage</div>
    <div class="ph-body">
      <div class="ph-group" style="padding:14px 16px">
        <div style="display:flex;gap:10px;align-items:flex-start"><span class="t-warn" style="padding-top:2px">${ic('clock',18)}</span><div style="flex:1"><div style="font-weight:600;font-size:16px">Migrate session store is paused</div><div class="muted" style="font-size:14px;line-height:19px;margin-top:2px">Codex on orion hit its 5-hour limit.</div></div></div>
        <div class="num" style="font-size:30px;line-height:36px;font-weight:600;letter-spacing:-0.02em;margin:12px 0 0" data-countdown="resume">2h 10m 00s</div>
        <div class="faint" style="font-size:14px;margin-bottom:14px">Auto-resumes at 14:32</div>
        <div style="display:flex;gap:10px"><button class="btn secondary sm" style="flex:1">Cancel</button><button class="btn primary sm" style="flex:1">Resume now</button></div>
      </div>
      <div class="ph-group" style="display:grid;grid-template-columns:1fr 1fr">
        ${mini('Tokens','1.24M','+12% vs prior')}<div style="border-left:1px solid var(--line)">${mini('Cost','$18.42','estimate')}</div>
        <div style="border-top:1px solid var(--line)">${mini('Throughput','54 tok/s','p50')}</div><div style="border-top:1px solid var(--line);border-left:1px solid var(--line)">${mini('First token','0.8 s','p50')}</div>
      </div>
      <div class="ph-group" style="padding:14px 16px 12px">
        <div class="seg" style="margin-bottom:14px"><button aria-selected="true" style="height:28px;font-size:13px">Tokens</button><button aria-selected="false" style="height:28px;font-size:13px">Cost</button><button aria-selected="false" style="height:28px;font-size:13px">Speed</button></div>
        <svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tokens per day, last 14 days">${svg}<line x1="0" x2="${W}" y1="${H-16}" y2="${H-16}" stroke="var(--line-2)"/><text x="2" y="${H-2}" font-size="11" fill="var(--fg-3)">Oct 30</text><text x="${W-2}" y="${H-2}" font-size="11" fill="var(--fg-3)" text-anchor="end">Today</text></svg>
        <div class="legend" style="margin:10px 0 0;gap:12px;font-size:12px">${SERIES.map(s=>`<span><i style="background:var(${s.c})"></i>${s.k}</span>`).join('')}</div>
      </div>
      <div class="ph-gh">Limits</div>
      <div class="ph-group">
        <div class="ph-li" style="display:block"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Codex · orion</span><span class="t-danger" style="font-size:14px;font-weight:500">Limited</span></div><div class="meter full"><i style="width:100%"></i></div><div class="faint" style="font-size:13px;margin-top:6px">5-hour · resets 14:32</div></div>
        <div class="ph-li" style="display:block"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Claude Code · atlas</span><span class="t-warn num" style="font-size:14px;font-weight:500">78%</span></div><div class="meter warn"><i style="width:78%"></i></div><div class="faint" style="font-size:13px;margin-top:6px">Weekly · resets Mon 09:00</div></div>
      </div>
    </div>
    ${phTabs('p-usage')}`);
}

/* ───────────── Registry ───────────── */
const SCREENS = [
  ['Desktop', [
    ['inbox','Inbox · Working + thread', scrInbox],
    ['inbox-done','Inbox · Done', scrDone],
    ['subagents','Thread · subagents', scrSubagents],
    ['terminal','Thread · terminal', scrTerminal],
    ['ide','Editor · diff vs agent', scrIDE],
    ['library','MCP servers & skills', scrLibrary],
    ['usage','Usage & limits', scrUsage],
    ['pr','Pull request', scrPR],
    ['set-hosts','Settings · hosts', scrHosts],
    ['set-devices','Settings · devices + pairing', scrDevices],
    ['set-providers','Settings · CLIProxyAPI', scrProviders],
    ['palette','Command palette', scrPalette],
    ['state-empty','State · empty', scrEmpty],
    ['state-loading','State · loading', scrLoading],
    ['state-offline','State · offline', scrOffline],
    ['state-error','State · error', scrError],
  ]],
  ['Phone', [
    ['p-inbox','Phone · inbox', pInbox],
    ['p-thread','Phone · thread', pThread],
    ['p-approval','Phone · approval', pApproval],
    ['p-terminal','Phone · terminal', pTerminal],
    ['p-pairing','Phone · pairing', pPairing],
    ['p-usage','Phone · usage', pUsage],
  ]],
];
const FLAT = Object.fromEntries(SCREENS.flatMap(([g,l])=>l.map(([id,lab,fn])=>[id,{lab,fn,phone:g==='Phone'}])));
const ALIAS = { 'set-general':'set-hosts','set-appearance':'set-hosts','set-notif':'set-hosts','set-keys':'set-hosts','set-account':'set-hosts', 'p-pr':'p-inbox','p-more':'p-pairing' };
const PHONE_MAP = { inbox:'p-inbox', 'inbox-done':'p-inbox', subagents:'p-thread', terminal:'p-terminal', usage:'p-usage', 'set-devices':'p-pairing', palette:'p-inbox' };
const DESK_MAP = { 'p-inbox':'inbox','p-thread':'inbox','p-approval':'inbox','p-terminal':'terminal','p-pairing':'set-devices','p-usage':'usage' };

/* ───────────── Render + interactions ───────────── */
const stage = document.getElementById('stage');
function render(){
  const id = FLAT[S.screen] ? S.screen : 'inbox';
  const sc = FLAT[id];
  if(id!=='inbox-done' && !S._keepTab) S.tab = S.tab || 'working';
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle('frame-phone', sc.phone);
  stage.innerHTML = sc.fn();
  if(id==='inbox-done') S.tab='working';
  document.getElementById('pick').value = id;
  document.getElementById('tgTheme').innerHTML = ic(S.theme==='dark'?'sun':'moon',14);
  document.getElementById('tgFrame').innerHTML = ic(sc.phone?'monitor':'phone',14);
  drawChart(); tick(); glyphKbd();
  document.querySelectorAll('.stream, .ph-body.tail').forEach(e=>e.scrollTop=e.scrollHeight);
  const u = new URLSearchParams(location.hash.slice(1)); u.set('s',id); u.set('t',S.theme); history.replaceState(null,'','#'+u.toString());
}
const KG = { '⌘':P.cmd, '↵':'<polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>', '⌫':'<path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/>', '⇧':'<path d="M9 18v-6H5l7-7 7 7h-4v6H9z"/>', '↑':'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>', '↓':'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>' };
function glyphKbd(){ document.querySelectorAll('.kbd').forEach(k=>{ if(k.dataset.g) return; k.dataset.g=1; k.innerHTML = [...k.textContent].map(c=>KG[c]?`<svg viewBox="0 0 24 24" aria-hidden="true">${KG[c]}</svg>`:c).join(''); k.setAttribute('aria-label', k.textContent.replace('⌘','Command ').replace('↵','Return').replace('⌫','Backspace').replace('⇧','Shift ')); }); }
function tick(){
  const n = nowMs();
  document.querySelectorAll('[data-countdown="resume"]').forEach(e=>e.textContent = hms(RESUME_AT-n));
  document.querySelectorAll('[data-countdown="resume-short"]').forEach(e=>e.textContent = hms(RESUME_AT-n,false));
  document.querySelectorAll('[data-countdown="pair"]').forEach(e=>e.textContent = hms(PAIR_EXP-n));
}
setInterval(tick, 1000);
const pick = document.getElementById('pick');
pick.innerHTML = SCREENS.map(([g,l])=>`<optgroup label="${g}">${l.map(([id,lab])=>`<option value="${id}">${lab}</option>`).join('')}</optgroup>`).join('');
pick.onchange = () => { S.screen = pick.value; render(); };
document.getElementById('tgTheme').onclick = () => { S.theme = S.theme==='dark'?'light':'dark'; render(); };
document.getElementById('tgFrame').onclick = () => { const ph = FLAT[S.screen]?.phone; S.screen = ph ? (DESK_MAP[S.screen]||'inbox') : (PHONE_MAP[S.screen]||'p-inbox'); render(); };
document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]'); const act = e.target.closest('[data-act]'); const tab = e.target.closest('[data-tab]'); const tool = e.target.closest('.tool');
  if(go && go.dataset.go){ e.preventDefault(); const g = ALIAS[go.dataset.go] || go.dataset.go; if(FLAT[g]){ S.screen=g; render(); } return; }
  if(tab){ S.tab = tab.dataset.tab; if(S.screen!=='inbox') S.screen='inbox'; render(); return; }
  if(act){ const a=act.dataset.act;
    if(a==='palette'){ S.screen='palette'; render(); }
    if(a==='closepal'){ S.screen='inbox'; render(); }
    if(a==='approve'){ const c=act.closest('.ask'); c.classList.add('gone'); document.getElementById('live').textContent='Approved. Codex is running the command on orion.'; setTimeout(()=>{ S.approved=true; render(); }, 200); }
    if(a==='deny'){ document.getElementById('live').textContent='Denied. The subagent stopped; the parent keeps running.'; }
    if(a==='undo'){ S.approved=false; render(); }
    if(a==='charttable'){ S.chartTable=!S.chartTable; render(); }
    return; }
  if(tool && tool.hasAttribute('aria-expanded')){ tool.setAttribute('aria-expanded', tool.getAttribute('aria-expanded')!=='true'); }
});
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); S.screen = S.screen==='palette'?'inbox':'palette'; render(); }
  if(e.key==='Escape' && S.screen==='palette'){ S.screen='inbox'; render(); }
  if((e.metaKey||e.ctrlKey) && e.shiftKey && e.key.toLowerCase()==='l'){ e.preventDefault(); S.theme = S.theme==='dark'?'light':'dark'; render(); }
});
window.addEventListener('resize', ()=>drawChart());
(function init(){
  const u = new URLSearchParams(location.hash.slice(1));
  if(u.get('s')) S.screen = u.get('s');
  S.theme = u.get('t') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  if(u.get('ui')==='0') document.body.classList.add('shot');
  if(u.get('still')==='1') document.body.classList.add('still');
  document.fonts?.ready.then(()=>drawChart());
  render();
})();
</script>
