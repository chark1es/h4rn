[workspace]

[package]
name = "h4rn-mobile"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
name = "h4rn_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }
# Used only on a macOS host building the iOS target: it links the local Swift
# package that implements the Keychain secret store (see build.rs).
tauri-utils = { version = "2.10.2", features = ["build"] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-barcode-scanner = "2.5.3"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
