[workspace]

[package]
name = "h4rn-desktop"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["h4rn contributors"]
description = "The h4rn desktop shell"
publish = false

[lib]
name = "h4rn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
getrandom = "0.3.4"
keyring = { version = "4.2.0", features = ["v1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-shell = "2.6.0"
tauri-plugin-single-instance = { version = "=2.4.5", features = ["deep-link"] }
tauri-plugin-updater = "2.13.1"
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1.54.1", features = ["sync", "time", "net", "io-util"] }
