name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bindings:
    name: TypeScript bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-bindings.sh

  wasm:
    name: Browser transport wasm is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "$(scripts/wasm.sh version)" --locked
      - run: scripts/wasm.sh check

  ui:
    name: UI (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/ui typecheck
      - run: bun run --cwd apps/ui lint
      - run: bun run --cwd apps/ui test
      - run: bun run --cwd apps/ui build

  connect-postgres:
    name: Connect Postgres integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: h4rn
          POSTGRES_PASSWORD: h4rn-test-password
          POSTGRES_DB: h4rn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U h4rn -d h4rn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      H4RN_TEST_DATABASE_URL: postgres://h4rn:h4rn-test-password@127.0.0.1:5432/h4rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # The `#[ignore]`d suites that need only Postgres. The OrbitID-backed
      # suites (`orbitid`, and the daemon `remote` test) cannot run here; see
      # docs/release.md.
      - run: cargo test -p h4rn-connect --test postgres --test skills -- --ignored --test-threads=1
      # The daemon relay paths against an in-process h4rn-connect on this
      # Postgres, with sessions minted through the relay's own store instead of
      # an OIDC device grant. Covers relay-only MCP sharing with revocation and
      # relay pairing that waits for the host's SAS confirmation. The full
      # OrbitID e2e remains `scripts/test-remote.sh`.
      - run: cargo test -p h4rn-daemon --test relay_ci -- --ignored --test-threads=1

  tauri-desktop:
    name: Tauri desktop crate compiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  mobile-android:
    name: Android APKs build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - run: bun install --frozen-lockfile
      # The script installs the Rust Android targets, runs `tauri android init`
      # into the ignored gen/ tree, applies native/android over the result and
      # builds one debug APK per ABI (x86_64 emulator + aarch64 devices).
      # It also compiles the checked-in release signing configuration, so a
      # broken Gradle overlay fails on the PR rather than at release time.
      - run: scripts/mobile-android.sh build

  mobile-ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Simulator builds need no Apple credentials and are therefore the part
      # CI can verify. TestFlight signing requirements are in docs/mobile.md.
      - run: bun run --cwd apps/mobile tauri ios init --ci
      - run: bun run --cwd apps/mobile tauri ios build --debug --ci --target aarch64-sim

  packaging:
    name: Packaging config (Helm, actionlint, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint and render the Helm chart
        run: |
          helm lint packaging/helm/h4rn-connect
          helm template h4rn packaging/helm/h4rn-connect \
            --set secrets.kek=00000000000000000000000000000000 \
            --set secrets.signingKey=11111111111111111111111111111111 \
            --set postgres.auth.password=test-password >/tmp/h4rn-connect.yaml
          grep -q 'kind: Deployment' /tmp/h4rn-connect.yaml
          grep -q 'kind: StatefulSet' /tmp/h4rn-connect.yaml
      - name: Shell syntax and YAML parse
        run: |
          bash -n scripts/mobile-android.sh
          for script in packaging/scripts/*.sh packaging/daemon/launchd/install.sh; do
            bash -n "${script}"
          done
          # Helm templates are Go text/template, not YAML until rendered;
          # helm lint/template above validates those.
          ruby -e '
            require "yaml"
            Dir.glob("packaging/**/*.{yaml,yml}").each do |path|
              next if path.split(File::SEPARATOR).include?("templates")
              YAML.load_file(path)
            end
          '
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [rust, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: h4rn/connect:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
