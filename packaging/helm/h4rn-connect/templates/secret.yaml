{{- if not .Values.secrets.existingSecret }}
{{- $secretName := include "h4rn-connect.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $kek := .Values.secrets.kek }}
{{- if and (not $kek) $existing (hasKey $existing.data "kek") }}
{{- $kek = index $existing.data "kek" | b64dec }}
{{- end }}
{{- if not $kek }}
{{- $kek = randAlphaNum 32 }}
{{- end }}
{{- $signing := .Values.secrets.signingKey }}
{{- if and (not $signing) $existing (hasKey $existing.data "signing-key") }}
{{- $signing = index $existing.data "signing-key" | b64dec }}
{{- end }}
{{- if not $signing }}
{{- $signing = randAlphaNum 32 }}
{{- end }}
{{- $postgresPassword := .Values.postgres.auth.password }}
{{- if and (not $postgresPassword) $existing (hasKey $existing.data "postgres-password") }}
{{- $postgresPassword = index $existing.data "postgres-password" | b64dec }}
{{- end }}
{{- if and (not $postgresPassword) .Values.postgres.enabled }}
{{- $postgresPassword = randAlphaNum 24 }}
{{- end }}
{{- $databaseUrl := .Values.secrets.databaseUrl }}
{{- if not $databaseUrl }}
{{- if .Values.postgres.enabled }}
{{- $databaseUrl = printf "postgres://%s:%s@%s:5432/%s" .Values.postgres.auth.username (urlquery $postgresPassword) (include "h4rn-connect.postgresServiceName" .) .Values.postgres.auth.database }}
{{- else if .Values.externalDatabase.url }}
{{- $databaseUrl = .Values.externalDatabase.url }}
{{- else }}
{{- $databaseUrl = printf "postgres://%s:%s@%s:%v/%s" .Values.externalDatabase.user (urlquery .Values.externalDatabase.password) .Values.externalDatabase.host .Values.externalDatabase.port .Values.externalDatabase.database }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "h4rn-connect.labels" . | nindent 4 }}
type: Opaque
data:
  kek: {{ $kek | b64enc | quote }}
  signing-key: {{ $signing | b64enc | quote }}
  database-url: {{ $databaseUrl | b64enc | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ $postgresPassword | b64enc | quote }}
  {{- end }}
{{- end }}
