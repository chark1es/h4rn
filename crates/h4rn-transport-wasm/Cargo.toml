[package]
name = "h4rn-transport-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen wrapper around the h4rn encrypted multipath transport"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
getrandom = { workspace = true, features = ["wasm_js"] }
h4rn-protocol.workspace = true
h4rn-transport = { workspace = true, default-features = false }
hex.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

# `x25519-dalek`/`rand_core` still pull getrandom 0.2, whose `js` feature must
# also be on for wasm32-unknown-unknown; getrandom 0.3 uses the backend cfg in
# `.cargo/config.toml` instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test.workspace = true
