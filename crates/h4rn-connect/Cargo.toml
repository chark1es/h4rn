[package]
name = "h4rn-connect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The self-hostable h4rn relay (axum + Postgres)"

[lib]
name = "h4rn_connect"
path = "src/lib.rs"

[[bin]]
name = "h4rn-connect"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
clap.workspace = true
ed25519-dalek = { workspace = true, features = ["std", "rand_core"] }
futures.workspace = true
h4rn-protocol.workspace = true
h4rn-skills.workspace = true
hex.workspace = true
openidconnect.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["form", "http2"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pem"] }
rsa = { version = "0.9.10", features = ["sha2"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
http-body-util = "0.1.5"
reqwest = { workspace = true, features = ["cookies"] }
tempfile.workspace = true
tokio-tungstenite.workspace = true
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true
rand_core = { version = "0.6.4", features = ["getrandom"] }
